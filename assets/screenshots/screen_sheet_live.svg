  <rect x="680" y="10" width="100" height="22" rx="4" fill="#065f46" />
  <text x="730" y="25" fill="#34d399" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">● Conectado</text>

