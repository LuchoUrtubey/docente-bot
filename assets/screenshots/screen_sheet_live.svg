  <text x="75" y="64" fill="#94a3b8" font-family="monospace" font-size="12">fx</text>
  <text x="100" y="64" fill="#38bdf8" font-family="monospace" font-size="11">=IF(AND(F2&gt;=7, G2&gt;=7, H2&gt;=7, J2&gt;=0.75), "PROMOCIONA", "REGULAR")</text>

