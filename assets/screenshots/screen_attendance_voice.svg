<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1621" />
      <stop offset="100%" stop-color="#0b1119" />
    </linearGradient>
    <linearGradient id="userBubble3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b5278" />
      <stop offset="100%" stop-color="#244566" />
    </linearGradient>
  </defs>

  <rect width="400" height="700" fill="url(#bgGrad3)" />

  <!-- Header -->
  <rect width="400" height="60" fill="#17212b" />
  <circle cx="35" cy="30" r="18" fill="#2b5278" />
  <text x="35" y="36" fill="#ffffff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">DB</text>
  <text x="65" y="27" fill="#ffffff" font-family="Inter, sans-serif" font-size="14" font-weight="bold">DocenteBot</text>
  <text x="65" y="42" fill="#5b88bd" font-family="Inter, sans-serif" font-size="11">bot oficial de cátedra</text>

  <!-- Timestamp Badge -->
  <rect x="130" y="80" width="140" height="22" rx="11" fill="#1e2c3a" />
  <text x="200" y="95" fill="#7f9fb5" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">VIERNES • 19:22 HS</text>

  <!-- 1. Student sends keyword -->
  <rect x="250" y="125" width="130" height="40" rx="12" fill="url(#userBubble3)" />
  <text x="265" y="150" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="bold">fourier2026</text>
  <text x="365" y="158" fill="#8cb3d9" font-family="Inter, sans-serif" font-size="9" text-anchor="end">19:22 ✓✓</text>

  <!-- Bot confirms attendance -->
  <rect x="20" y="185" width="340" height="85" rx="12" fill="#182533" />
  <text x="35" y="210" fill="#4caf50" font-family="Inter, sans-serif" font-size="13" font-weight="bold">✅ ¡Presente registrado con éxito, Juan!</text>
  <text x="35" y="235" fill="#cad5e2" font-family="Inter, sans-serif" font-size="11">⏰ Horario: 19:22:05 hs</text>
  <text x="35" y="252" fill="#8b9eb3" font-family="Inter, sans-serif" font-size="10">Estado: Válido dentro de la ventana de cursada.</text>
  <text x="340" y="260" fill="#6c7f93" font-family="Inter, sans-serif" font-size="9" text-anchor="end">19:22</text>

  <!-- 2. Student sends Voice Note -->
  <rect x="210" y="295" width="170" height="48" rx="14" fill="url(#userBubble3)" />
  <circle cx="232" cy="319" r="14" fill="#ffffff" />
  <!-- Play triangle -->
  <path d="M228 312 L238 319 L228 326 Z" fill="#2b5278" />
  <!-- Waveform representation -->
  <line x1="255" y1="319" x2="255" y2="319" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  <line x1="262" y1="312" x2="262" y2="326" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  <line x1="269" y1="308" x2="269" y2="330" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  <line x1="276" y1="314" x2="276" y2="324" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  <line x1="283" y1="305" x2="283" y2="333" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  <line x1="290" y1="311" x2="290" y2="327" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  <line x1="297" y1="316" x2="297" y2="322" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  <text x="325" y="323" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="bold">0:08</text>
  <text x="365" y="337" fill="#8cb3d9" font-family="Inter, sans-serif" font-size="9" text-anchor="end">19:25 ✓✓</text>

  <!-- Bot Voice Transcription + Answer -->
  <rect x="20" y="365" width="340" height="120" rx="12" fill="#182533" />
  <text x="35" y="390" fill="#90caf9" font-family="Inter, sans-serif" font-size="11" font-style="italic">🎙️ Audio transcripto (SpeechRecognition):</text>
  <text x="35" y="410" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="bold">"¿cuándo rendimos el segundo parcial?"</text>
  
  <line x1="35" y1="425" x2="335" y2="425" stroke="#25374a" stroke-width="1" />

  <text x="35" y="445" fill="#cad5e2" font-family="Inter, sans-serif" font-size="11">💡 Fechas de evaluación:</text>
  <text x="35" y="465" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="11">• Parcial 2: <tspan font-weight="bold" fill="#64b5f6">2026-11-13</tspan> | TP Final: <tspan font-weight="bold" fill="#64b5f6">2026-11-20</tspan></text>
  <text x="340" y="475" fill="#6c7f93" font-family="Inter, sans-serif" font-size="9" text-anchor="end">19:25</text>

  <!-- Input Bar -->
  <rect y="640" width="400" height="60" fill="#17212b" />
  <rect x="15" y="650" width="320" height="40" rx="20" fill="#0e1621" />
  <text x="35" y="675" fill="#6c7f93" font-family="Inter, sans-serif" font-size="13">Mensaje...</text>
  <circle cx="365" cy="670" r="18" fill="#5b88bd" />
  <path d="M360 662 L372 670 L360 678 Z" fill="#ffffff" />
</svg>
