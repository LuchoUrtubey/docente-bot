  <text x="35" y="240" fill="#cad5e2" font-family="Inter, sans-serif" font-size="12">👤 Estudiante: <tspan font-weight="bold" fill="#ffffff">Pérez, Juan Manuel</tspan></text>
  <text x="35" y="258" fill="#8b9eb3" font-family="Inter, sans-serif" font-size="11">📄 DNI: 40111222</text>

  <line x1="35" y1="272" x2="335" y2="272" stroke="#25374a" stroke-width="1" />

  <!-- Exam Marks Grid -->
  <text x="35" y="300" fill="#cad5e2" font-family="Inter, sans-serif" font-size="12">📝 Parcial 1:</text>
  <text x="140" y="300" fill="#4caf50" font-family="Inter, sans-serif" font-size="13" font-weight="bold">8</text>

  <text x="200" y="300" fill="#cad5e2" font-family="Inter, sans-serif" font-size="12">📝 Parcial 2:</text>
  <text x="300" y="300" fill="#4caf50" font-family="Inter, sans-serif" font-size="13" font-weight="bold">7</text>

  <text x="35" y="335" fill="#cad5e2" font-family="Inter, sans-serif" font-size="12">💻 TP Final:</text>
  <text x="140" y="335" fill="#4caf50" font-family="Inter, sans-serif" font-size="13" font-weight="bold">9</text>

  <text x="200" y="335" fill="#cad5e2" font-family="Inter, sans-serif" font-size="12">📅 Asistencia:</text>
  <text x="300" y="335" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="bold">87.5%</text>

  <line x1="35" y1="360" x2="335" y2="360" stroke="#25374a" stroke-width="1" />

  <!-- Status Badge -->
  <text x="35" y="395" fill="#cad5e2" font-family="Inter, sans-serif" font-size="12">Condición Final:</text>
  <rect x="150" y="377" width="130" height="26" rx="6" fill="#1b4d3e" />
  <text x="215" y="395" fill="#a7f3d0" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">🏆 PROMOCIONA</text>

  <text x="35" y="440" fill="#6c7f93" font-family="Inter, sans-serif" font-size="10" font-style="italic">Actualizado en vivo según fórmulas del Sheet</text>
  <text x="340" y="455" fill="#6c7f93" font-family="Inter, sans-serif" font-size="9" text-anchor="end">19:15</text>

  <!-- Input Bar -->
  <rect y="640" width="400" height="60" fill="#17212b" />
  <rect x="15" y="650" width="320" height="40" rx="20" fill="#0e1621" />
  <text x="35" y="675" fill="#6c7f93" font-family="Inter, sans-serif" font-size="13">Mensaje...</text>
  <circle cx="365" cy="670" r="18" fill="#5b88bd" />
  <path d="M360 662 L372 670 L360 678 Z" fill="#ffffff" />
