<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1621" />
      <stop offset="100%" stop-color="#0b1119" />
    </linearGradient>
    <linearGradient id="userBubble2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b5278" />
      <stop offset="100%" stop-color="#244566" />
    </linearGradient>
  </defs>

  <rect width="400" height="700" fill="url(#bgGrad2)" />

  <!-- Header -->
  <rect width="400" height="60" fill="#17212b" />
  <circle cx="35" cy="30" r="18" fill="#2b5278" />
  <text x="35" y="36" fill="#ffffff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">DB</text>
  <text x="65" y="27" fill="#ffffff" font-family="Inter, sans-serif" font-size="14" font-weight="bold">DocenteBot</text>
  <text x="65" y="42" fill="#5b88bd" font-family="Inter, sans-serif" font-size="11">bot oficial de cátedra</text>

  <!-- Timestamp Badge -->
  <rect x="140" y="80" width="120" height="22" rx="11" fill="#1e2c3a" />
  <text x="200" y="95" fill="#7f9fb5" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">HOY • 19:15</text>

  <!-- Student Asks for Grades -->
  <rect x="260" y="125" width="120" height="40" rx="12" fill="url(#userBubble2)" />
  <text x="275" y="150" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="bold">mis notas</text>
  <text x="365" y="158" fill="#8cb3d9" font-family="Inter, sans-serif" font-size="9" text-anchor="end">19:15 ✓✓</text>

  <!-- Bot Grades Card -->
  <rect x="20" y="185" width="340" height="280" rx="14" fill="#182533" />
